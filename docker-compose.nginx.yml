services:
  app:
    image: elaxdev/nihongotracker:latest
    ports:
      - '3000:3000'
    env_file:
      - Backend/.env
    environment:
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-nihongotracker-master-key}
      DICTIONARY_SERVICE_URL: http://dictionary:8081
    depends_on:
      mongo:
        condition: service_healthy
      meilisearch:
        condition: service_started
      # Started, not healthy: a dictionary that is still importing must not hold
      # the app back, and the texthooker works without it.
      dictionary:
        condition: service_started
    volumes:
      - ./Backend/.env:/app/Backend/.env:ro
    networks:
      - nginx_default
    restart: always

  mongo:
    image: mongo:7
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - nginx_default
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: always
    ports:
      - '7700:7700'
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-nihongotracker-master-key}
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - nginx_default

  # Yomitan dictionary lookup for the texthooker. Reachable only on the internal
  # network — no host port, and nothing in nginx points at it. The browser talks
  # to the backend, which is where the auth and the rate limiting live.
  #
  # A published image, like `app` above: the source lives in the desktop
  # companion repository (`crates/dictionary-service`), next to the C++ engine
  # crate it wraps, so it is released from there rather than built from here.
  dictionary:
    image: ${DICTIONARY_IMAGE:-elaxdev/nihongotracker-dictionary:latest}
    restart: always
    environment:
      DICTIONARY_DATA_DIR: /data/dictionaries
      DICTIONARY_IMPORT_DIR: /data/import
      PORT: 8081
      RUST_LOG: ${DICTIONARY_LOG:-info}
    volumes:
      # Imported dictionaries survive restarts: importing Jitendex takes ~11 s
      # and produces 181 MB, and there is no reason to redo it on every boot.
      - dictionary-data:/data/dictionaries
      # Drop a Yomitan .zip here to have it imported on the next start.
      - ./dictionaries:/data/import:ro
    networks:
      - nginx_default

  migration:
    profiles: ['migration']
    image: elaxdev/nihongotracker:latest
    env_file:
      - Backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    command: >
      sh -c "cd /app/Backend && 
             npm run migrate:indexes:prod && 
             echo 'Migration completed successfully'"
    restart: 'no'
    networks:
      - nginx_default

volumes:
  mongo-data:
  meilisearch-data:
  dictionary-data:

networks:
  nginx_default:
    external: true
