<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <style>
    .orbit { transform-origin: 120px 120px; animation: orbit 36s linear infinite; }
    .stars { animation-duration: 40s; }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes twinkle {
      0%,12%,100% { opacity: 0; transform: scale(.55); }
      34%,60% { opacity: 1; transform: scale(1); }
      85% { opacity: 0; transform: scale(.7); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <path id="star" d="M0-10 2.8-2.8 10 0 2.8 2.8 0 10-2.8 2.8-10 0-2.8-2.8Z" />
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.6" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="85" stroke="#c675dc" stroke-width="2.2" filter="url(#soft)" />
  <circle cx="120" cy="120" r="82" stroke="#713184" stroke-width=".7" opacity=".65" />
