  </style>
  <defs><path id="star" d="M0-10 2.8-2.8 10 0 2.8 2.8 0 10-2.8 2.8-10 0-2.8-2.8Z"/><filter id="soft" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4" result="wide"/><feComponentTransfer in="wide" result="halo"><feFuncA type="linear" slope=".4"/></feComponentTransfer><feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="soft"/><feMerge><feMergeNode in="halo"/><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
