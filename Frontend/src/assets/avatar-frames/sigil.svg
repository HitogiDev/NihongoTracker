<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <style>
    .orbit { transform-origin: 120px 120px; animation: orbit 36s linear infinite; } @keyframes orbit { to { transform: rotate(360deg); } } .square { transform-origin:120px 120px; animation:orbit 15s linear infinite reverse; }
